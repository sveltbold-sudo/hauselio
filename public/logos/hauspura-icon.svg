<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="circleClip2">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#1B2A4A" stroke-width="24"/>
  
  <!-- Letter H (left) - Navy Blue -->
  <g clip-path="url(#circleClip2)">
    <!-- H left vertical -->
    <rect x="90" y="100" width="36" height="200" fill="#1B2A4A"/>
    <!-- H right vertical -->
    <rect x="184" y="100" width="36" height="200" fill="#1B2A4A"/>
    <!-- H horizontal bar -->
    <rect x="90" y="182" width="130" height="36" fill="#1B2A4A"/>
  </g>
  
  <!-- Letter P (right) - Orange -->
  <g clip-path="url(#circleClip2)">
    <!-- P vertical -->
    <rect x="220" y="100" width="36" height="200" fill="#F58220"/>
    <!-- P top curve -->
    <path d="M256,100 L310,100 C350,100 350,200 310,200 L256,200" fill="#F58220"/>
  </g>
</svg>