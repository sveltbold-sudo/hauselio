<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- HAUSAURA Icon - HA Monogram -->
  <!-- Style: Similar to original HAUSELIO H+E, but with H+A -->
  
  <defs>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="175"/>
    </clipPath>
  </defs>
  
  <!-- Outer circle - Navy Blue -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#1B2A4A" stroke-width="20"/>
  
  <!-- H (left) - Navy Blue -->
  <g clip-path="url(#circleClip)">
    <!-- H left vertical -->
    <rect x="80" y="100" width="40" height="200" fill="#1B2A4A"/>
    <!-- H right vertical -->
    <rect x="170" y="100" width="40" height="200" fill="#1B2A4A"/>
    <!-- H horizontal bar -->
    <rect x="80" y="180" width="130" height="40" fill="#1B2A4A"/>
  </g>
  
  <!-- A (right) - Orange, matching the E style from original -->
  <g clip-path="url(#circleClip)">
    <!-- A vertical stroke -->
    <rect x="220" y="100" width="40" height="200" fill="#F58220"/>
    <!-- A top horizontal -->
    <rect x="220" y="100" width="100" height="35" fill="#F58220"/>
    <!-- A middle horizontal -->
    <rect x="220" y="180" width="80" height="35" fill="#F58220"/>
    <!-- A bottom horizontal -->
    <rect x="220" y="265" width="100" height="35" fill="#F58220"/>
  </g>
</svg>