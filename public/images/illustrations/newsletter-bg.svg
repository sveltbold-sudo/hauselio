<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Grid pattern -->
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Central glow -->
  <ellipse cx="400" cy="200" rx="300" ry="200" fill="url(#glow)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="60" fill="white" opacity="0.05"/>
  <circle cx="700" cy="320" r="80" fill="white" opacity="0.05"/>
  <circle cx="650" cy="100" r="40" fill="white" opacity="0.08"/>
  <circle cx="150" cy="300" r="50" fill="white" opacity="0.06"/>
  
  <!-- Floating dots -->
  <circle cx="200" cy="150" r="3" fill="white" opacity="0.2"/>
  <circle cx="600" cy="250" r="4" fill="white" opacity="0.15"/>
  <circle cx="350" cy="100" r="2" fill="white" opacity="0.25"/>
  <circle cx="500" cy="300" r="3" fill="white" opacity="0.2"/>
</svg>
